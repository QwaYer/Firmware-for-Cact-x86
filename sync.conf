# cactsync manifest — see ../.cactsync/README.md
#
# This repo is the Cact-side home for firmware; the upstream tree itself lives
# in the sibling clone ../Linux/linux-firmware, which already has origin pointing
# at kernel.org and carries no Cact patches, so syncing it is a plain
# fast-forward.  Nothing is written into the clone's working tree.

CACT_SYNC_NAME="Firmware-for-Cact-x86"
CACT_SYNC_TREE="../Linux/linux-firmware"

CACT_SYNC_REMOTE="origin"
CACT_SYNC_URL="https://git.kernel.org/pub/scm/linux/kernel/git/firmware/linux-firmware.git"

CACT_SYNC_BRANCH="main"
CACT_SYNC_TAG_GLOB=""

CACT_SYNC_REF=""

CACT_SYNC_MODE="ff"

# linux-firmware is huge and moves daily; fetching it is a deliberate action.
CACT_SYNC_UNSHALLOW=0

CACT_SYNC_VERIFY=""

CACT_SYNC_NOTES="linux-firmware clone at ../Linux/linux-firmware (fast-forward only)"
